# AgriVision – Netlify configuration
# Drop this repository into Netlify (or run `netlify deploy`) and the settings
# below apply automatically. There is no build step: the repository IS the site.

[build]
  publish = "."
  command = ""

# Pretty URLs: /crops serves crops.html (also what tools/serve.mjs does locally)
[build.processing]
  skip_processing = false

[[redirects]]
  from = "/crops"
  to = "/crops.html"
  status = 200

[[redirects]]
  from = "/farming"
  to = "/farming.html"
  status = 200

[[redirects]]
  from = "/soil"
  to = "/soil.html"
  status = 200

[[redirects]]
  from = "/irrigation"
  to = "/irrigation.html"
  status = 200

[[redirects]]
  from = "/pest-management"
  to = "/pest-management.html"
  status = 200

[[redirects]]
  from = "/modern-farming"
  to = "/modern-farming.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Anything else that does not exist gets the branded 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security + freshness headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Allows: Google Fonts, three.js (cdnjs) and supabase-js (jsdelivr).
    # If you add another third-party script, add its host to script-src here.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'"

# HTML must never be cached hard: content updates should appear immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
